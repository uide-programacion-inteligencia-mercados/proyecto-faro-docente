# ============================================================================
# ARCHIVO: orquestador_diario.yml        (el DESPERTADOR)          · MEJORADO S08
# ----------------------------------------------------------------------------
# QUÉ ES:   Las instrucciones que GitHub lee solo. Vive en .github/workflows/
# QUÉ HACE: Decide CUÁNDO despierta el robot, DÓNDE trabaja y QUÉ pasos sigue.
# NOVEDAD DE LA SEMANA 8 («Reporte PDF»): instala las librerías del PDF (pango, Jinja2 y WeasyPrint);
#   el pipeline escribe reports/ultimo.pdf y el paso «Guardar el reporte de hoy» ya lo deja como archivo
#   descargable y lo guarda en el repositorio junto con el resto de reports/.
# NOVEDADES DE LA SEMANA 7 («Avisa si falla»):
#   1. Casilla «simular_falla» en el botón Run workflow: un simulacro de incendio.
#   2. La bitácora y la salud se guardan SIEMPRE, incluso si la corrida falló.
#   3. Si el robot falla, abre una alerta (un Issue) en la casa del equipo.
#      Si ya había una alerta abierta, solo le agrega un comentario (no inunda).
#   4. Cuando el robot vuelve a funcionar, cierra la alerta solo.
# ESTO PUEDES CAMBIARLO EN TU PROYECTO: la hora del cron y los textos de la alerta.
# ============================================================================
name: Orquestador diario del Observatorio

on:
  schedule:
    - cron: "0 11 * * *"          # todos los días a las 11:00 UTC = 06:00 en Quito
  workflow_dispatch:              # botón Run workflow en la pestaña Actions
    inputs:
      simular_falla:              # S07 · la casilla del simulacro
        description: "Simulacro: provocar una falla para probar la alerta"
        type: boolean
        default: false

permissions:
  contents: write                 # guardar datos en el repositorio
  issues: write                   # S07 · abrir y cerrar las alertas

concurrency:
  group: orquestador-diario
  cancel-in-progress: false

jobs:
  correr-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15           # si se cuelga más de 15 minutos, GitHub lo detiene
    env:
      GH_TOKEN: ${{ github.token }}          # la llave para que «gh» abra alertas
      GH_REPO: ${{ github.repository }}
      URL_CORRIDA: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Traer el código
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # S08 · WeasyPrint necesita la librería de texto «pango». Casi siempre ya viene; si no, la instala.
      - name: Preparar las librerías del PDF
        run: |
          sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 \
            || (sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0)

      - name: Instalar lo necesario
        run: pip install -r requirements.txt

      - name: Probar que el código funciona (usa los respaldos, no sale a internet)
        run: FARO_MODO=respaldo python -m pytest -q

      - name: Correr el pipeline (fuentes reales, con respaldo si fallan)
        env:
          FARO_SIMULAR_FALLA: ${{ inputs.simular_falla }}   # vacío en las corridas del reloj = no
        run: python pipeline.py

      - name: Guardar el reporte de hoy (con su PDF) como archivo descargable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-${{ github.run_number }}
          path: |
            reports/
            logs/
          if-no-files-found: ignore

      # S07 · if: always() = este paso se hace SIEMPRE. Así la bitácora y la salud
      # de una corrida fallida también quedan guardadas (la memoria de los fallos).
      # Los datos malos nunca llegan aquí: el control de calidad los detuvo antes.
      - name: Guardar datos, bitácora y salud (siempre)
        if: always()
        run: |
          git config user.name "observatorio-bot"
          git config user.email "observatorio-bot@users.noreply.github.com"
          git add data/ reports/ logs/
          if git diff --cached --quiet; then
            echo "No hay cambios que guardar."
          else
            git commit -m "Corrida ${{ github.run_number }} del $(date -u +%Y-%m-%d) (${{ job.status }})"
            git pull --rebase --quiet && git push
          fi

      # S07 · LA ALERTA. if: failure() = solo si algún paso anterior falló.
      - name: Abrir o actualizar la alerta
        if: failure()
        run: |
          gh label create alerta-robot --color C8102E --description "El robot del observatorio falló" --force
          ABIERTA=$(gh issue list --label alerta-robot --state open --json number --jq '.[].number' | head -n 1)
          if [ -n "$ABIERTA" ]; then
            gh issue comment "$ABIERTA" --body "Volvió a fallar el $(date -u '+%Y-%m-%d %H:%M') UTC. Detalle: $URL_CORRIDA"
          else
            gh issue create --label alerta-robot \
              --title "🚨 El robot del observatorio falló" \
              --body "El robot falló el $(date -u '+%Y-%m-%d %H:%M') UTC.

          **Qué mirar:** abre la corrida, entra al trabajo correr-pipeline y busca la primera línea roja.
          **Detalle:** $URL_CORRIDA
          **Salud:** logs/salud.csv y logs/estado.md

          Esta alerta se cierra sola cuando el robot vuelva a funcionar."
          fi

      # S07 · Si todo salió bien y había una alerta abierta, se cierra con una nota.
      - name: Cerrar la alerta si el robot se recuperó
        if: success()
        run: |
          for n in $(gh issue list --label alerta-robot --state open --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Recuperado: la corrida del $(date -u '+%Y-%m-%d %H:%M') UTC terminó bien. $URL_CORRIDA"
          done
